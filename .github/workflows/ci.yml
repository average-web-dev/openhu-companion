name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: openhu-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # unsigned: Play takes the bundle signed with the upload key (docker/dev.sh bundle with keystore.properties)
      - uses: actions/upload-artifact@v4
        with:
          name: openhu-companion-bundle-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
